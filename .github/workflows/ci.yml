name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:                      # Python 3.9 is tested on Linux and Windows
          - os: macos-latest
            python: "3.9"
          - os: ubuntu-latest         # ubuntu-latest is Ubuntu 26.04 from October 2026,
            python: "3.9"             # which has no Python 3.9 ...
        include:
          - os: ubuntu-24.04          # ... so Linux tests 3.9 on Ubuntu 24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Test
        run: pytest -q
      - name: Command line
        run: |
          mipy --version
          mipy example ex.csv
          mipy analyze ex.csv --methods quick --repeats 1 --quiet --out ex_out
